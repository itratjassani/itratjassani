name: Update contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: itratjassani
          outputs: |
            dist/github-contributions.svg?color_snake=%2322D3EE&color_dots=%230D1117,%232D1B53,%236D28D9,%23A855F7,%2322D3EE
      - name: Publish generated SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
